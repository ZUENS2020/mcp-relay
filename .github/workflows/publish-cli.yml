name: Publish MCP Relay CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#cli-v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-agent-binaries.sh

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in packages/mcp-relay-win32-x64 packages/mcp-relay-darwin-x64 packages/mcp-relay-darwin-arm64 packages/mcp-relay-linux-x64; do
            echo "publishing $d"
            (cd "$d" && npm publish --access public)
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/mcp-relay
          npm publish --access public
