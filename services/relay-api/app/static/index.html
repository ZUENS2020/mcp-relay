<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP Relay · 配置控制台</title>
  <link rel="stylesheet" href="/static/app.css?v=20260804k" />
</head>
<body data-theme="day">
  <a class="skip-link" href="#main">跳到主内容</a>

  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <div>
          <div class="login-title">MCP Relay</div>
          <div class="login-sub">配置控制台</div>
        </div>
      </div>
      <form id="login-form" class="login-form" method="post" action="#" autocomplete="on">
        <label>
          用户名
          <input id="login-user" name="username" type="text" autocomplete="username" required autofocus value="admin" />
        </label>
        <label>
          密码
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="login-error muted hidden" id="login-error" role="alert"></p>
        <button class="btn btn-primary login-submit" type="submit">登录</button>
      </form>
    </div>
  </div>

  <div class="shell hidden" id="app-shell">
    <aside class="nav" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        MCP Relay
      </div>
      <p class="brand-sub">配置控制台</p>

      <nav class="nav-groups">
        <div class="nav-group">
          <div class="nav-group-label">工作</div>
          <button type="button" data-view="config" class="active" aria-current="page">配置</button>
          <button type="button" data-view="scripts">批量脚本</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">系统</div>
          <button type="button" data-view="overview">总览</button>
          <button type="button" data-view="audit">审计</button>
        </div>
      </nav>

      <div class="nav-foot">
        <button type="button" class="btn btn-ghost" id="btn-theme" style="width:100%" aria-pressed="false">主题：日间</button>
        <button type="button" class="btn btn-ghost" id="btn-admin-logout" style="width:100%;margin-top:6px">退出登录</button>
      </div>
    </aside>

    <main class="main" id="main">
      <!-- 配置：设备 → Agent → mcp.json -->
      <section id="view-config" aria-labelledby="title-config">
        <div class="header device-header">
          <div>
            <h1 id="title-config">配置</h1>
            <p>选择设备与 Agent，编辑将下发的完整 mcp.json</p>
          </div>
          <div class="toolbar">
            <button class="btn" id="btn-refresh-config" type="button">刷新</button>
          </div>
        </div>
        <div class="device-workspace" id="device-workspace">
          <div class="panel col-devices">
            <div class="panel-head"><h2>设备</h2><span class="muted" id="device-count"></span></div>
            <div id="devices-list" role="listbox" aria-label="设备列表"></div>
          </div>
          <div
            class="col-split"
            data-split="devices"
            role="separator"
            aria-orientation="vertical"
            aria-label="拖拽调节设备列宽度"
            tabindex="0"
          ></div>
          <div class="panel col-agents">
            <div class="panel-head"><h2>Agent</h2><span class="muted" id="agent-count"></span></div>
            <div id="agents-list" role="listbox" aria-label="Agent 列表">
              <p class="muted pad">请先选择左侧设备</p>
            </div>
          </div>
          <div
            class="col-split"
            data-split="agents"
            role="separator"
            aria-orientation="vertical"
            aria-label="拖拽调节 Agent 列宽度"
            tabindex="0"
          ></div>
          <div class="panel col-mcp">
            <div class="panel-head">
              <div>
                <h2 id="mcp-title">mcp.json</h2>
                <div class="muted mono" id="mcp-path">—</div>
              </div>
              <div class="toolbar">
                <label class="agent-enable compact">
                  <input type="checkbox" id="agent-enabled" disabled />
                  启用
                </label>
                <button class="btn" id="btn-mcp-format" type="button" disabled title="Ctrl/⌘+Shift+F">格式化</button>
                <button class="btn" id="btn-mcp-reset" type="button" disabled>恢复上次保存</button>
                <button class="btn btn-primary" id="btn-mcp-save" type="button" disabled>保存</button>
              </div>
            </div>
            <div id="mcp-editor" class="mcp-editor" role="textbox" aria-label="MCP JSON 编辑器" aria-multiline="true"></div>
            <div class="mcp-foot muted" id="mcp-hint">右侧是该 Agent 的完整 MCP 文档，不按单个服务拆开编辑。</div>
          </div>
        </div>
      </section>

      <!-- 批量脚本 -->
      <section id="view-scripts" class="hidden" aria-labelledby="title-scripts">
        <div class="header">
          <div>
            <h1 id="title-scripts">批量脚本</h1>
            <p>YAML 或行式 DSL · 先试运行再正式应用</p>
          </div>
          <div class="toolbar">
            <label class="sr-only" for="script-format">脚本格式</label>
            <select id="script-format" aria-label="脚本格式">
              <option value="">自动识别</option>
              <option value="yaml">YAML</option>
              <option value="dsl">DSL</option>
            </select>
            <button class="btn" id="btn-script-example-yaml" type="button">YAML 示例</button>
            <button class="btn" id="btn-script-example-dsl" type="button">DSL 示例</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="panel">
            <div class="panel-head"><h2>脚本</h2></div>
            <label class="sr-only" for="script-editor">脚本内容</label>
            <textarea id="script-editor" class="script-editor" spellcheck="false" placeholder="enable profile:windows-desktop agent:cursor trek nowledge-mem"></textarea>
            <div class="form-actions">
              <button class="btn" id="btn-script-parse" type="button">解析</button>
              <button class="btn" id="btn-script-dry" type="button">试运行</button>
              <button class="btn btn-primary" id="btn-script-apply" type="button">应用</button>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>结果</h2><span class="muted" id="script-result-meta"></span></div>
            <pre class="preview" id="script-result">执行解析或试运行以预览匹配的设备</pre>
          </div>
        </div>
      </section>

      <!-- 总览 -->
      <section id="view-overview" class="hidden" aria-labelledby="title-overview">
        <div class="header">
          <div>
            <h1 id="title-overview">总览</h1>
            <p>按设备与 Agent 保存 mcp.json · 客户端同步下发</p>
          </div>
          <div class="toolbar">
            <button class="btn" id="btn-refresh" type="button">刷新</button>
            <button class="btn btn-primary" id="btn-release" type="button">发布版本</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="label">设备</div><div class="value" id="stat-devices">—</div></div>
          <div class="stat"><div class="label">在线</div><div class="value" id="stat-online">—</div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>最近设备同步</h2><span class="muted" id="health-line">检查中…</span></div>
          <div id="overview-devices"></div>
        </div>
      </section>

      <!-- 审计 -->
      <section id="view-audit" class="hidden" aria-labelledby="title-audit">
        <div class="header">
          <div>
            <h1 id="title-audit">审计</h1>
            <p>注册 · 发布 · 配置变更 · 同步轨迹</p>
          </div>
        </div>
        <div class="panel"><div id="audit-table"></div></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/static/app.js?v=20260804k"></script>
</body>
</html>
